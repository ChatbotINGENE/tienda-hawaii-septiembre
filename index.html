<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hawaii — Catálogo Preventa Septiembre 2026</title>
<meta name="description" content="Catálogo de preventa de nuevo producto: flores, follajes, macetas, coronas, juguetes y detalles con hasta 50% de ahorro. Pedidos por WhatsApp.">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="Hawaii — Catálogo Preventa Septiembre 2026">
<meta property="og:description" content="Nuevo producto con hasta 50% de ahorro. Reservas hasta el 5 de octubre.">
<link rel="icon" href="img/marca/logo-hawaii.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="catalogo.css?v=20260927110911">
</head>
<body>

<header class="barra">
  <button class="btn-barra" id="abrir-indice" aria-label="Índice del catálogo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    <span>Índice</span>
  </button>
  <button class="barra-logo" id="ir-portada" aria-label="Ir a la portada">
    <img src="img/marca/logo-hawaii.png" alt="Hawaii — Imagina, crea, comparte" width="1030" height="398">
  </button>
  <button class="btn-barra carrito-btn" id="abrir-carrito" aria-label="Ver mi pedido">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
    <span>Pedido</span>
    <b class="globo" id="contador" hidden>0</b>
  </button>
</header>

<main class="visor" id="visor" aria-label="Catálogo"></main>

<nav class="pasos" aria-label="Pasar página">
  <button class="paso" id="anterior" aria-label="Página anterior"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
  <div class="folio">
    <span id="folio-texto">1 / 1</span>
    <div class="regla"><i id="regla"></i></div>
  </div>
  <button class="paso" id="siguiente" aria-label="Página siguiente"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
</nav>

<!-- ══ Índice ══ -->
<div class="telon" id="telon-indice" hidden>
  <aside class="panel panel-izq" role="dialog" aria-modal="true" aria-labelledby="i-titulo">
    <header><h2 id="i-titulo">Índice</h2><button class="cerrar" data-cerrar aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
    <ol class="i-lista" id="i-lista"></ol>
  </aside>
</div>

<!-- ══ Ficha del producto ══ -->
<div class="telon" id="telon-ficha" hidden>
  <article class="ficha" role="dialog" aria-modal="true" aria-labelledby="f-nombre">
    <button class="cerrar" data-cerrar aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    <div class="ficha-foto"><img id="f-img" alt=""><span class="tag" id="f-tag"></span></div>
    <div class="ficha-datos">
      <p class="f-depto" id="f-depto"></p>
      <h2 id="f-nombre"></h2>
      <p class="f-cod" id="f-cod"></p>
      <div class="f-precio">
        <span class="antes" id="f-antes"></span>
        <span class="ahora" id="f-ahora"></span>
        <span class="ahorras" id="f-ahorras"></span>
      </div>
      <ul class="f-specs" id="f-specs"></ul>
      <div class="f-colores" id="f-colores-caja">
        <p>Color: <b id="f-color"></b></p>
        <div class="muestras" id="f-colores" role="radiogroup" aria-label="Color"></div>
      </div>
      <div class="f-accion">
        <div class="cant">
          <button type="button" data-cant="-1" aria-label="Quitar uno">−</button>
          <input id="f-cant" type="number" value="1" min="1" max="99" inputmode="numeric" aria-label="Cantidad">
          <button type="button" data-cant="1" aria-label="Agregar uno">+</button>
        </div>
        <button class="btn-negro" id="f-agregar">Agregar al pedido</button>
      </div>
    </div>
  </article>
</div>

<!-- ══ El pedido ══ -->
<div class="telon" id="telon-carrito" hidden>
  <aside class="panel panel-der" role="dialog" aria-modal="true" aria-labelledby="c-titulo">
    <header><h2 id="c-titulo">Mi pedido</h2><button class="cerrar" data-cerrar aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
    <div class="c-cuerpo" id="c-cuerpo"></div>
    <footer class="c-pie" id="c-pie">
      <dl class="totales">
        <div><dt>Precio normal</dt><dd id="t-normal"></dd></div>
        <div class="verde"><dt>Tu ahorro</dt><dd id="t-ahorro"></dd></div>
        <div class="total"><dt>Total preventa</dt><dd id="t-total"></dd></div>
      </dl>
      <p class="minimo" id="c-minimo" hidden></p>
      <input id="cli-nombre" type="text" autocomplete="name" placeholder="Tu nombre y apellido">
      <input id="cli-tel" type="tel" autocomplete="tel" inputmode="tel" placeholder="Tu teléfono (7777-7777)">
      <p class="aviso" id="c-aviso" hidden></p>
      <a class="btn-whatsapp" id="enviar" href="#" target="_blank" rel="noopener">Enviar pedido por WhatsApp</a>
    </footer>
  </aside>
</div>

<div class="brindis" id="brindis" hidden></div>

<script src="datos.js?v=20260927110911"></script>
<script src="catalogo.js?v=20260927110911"></script>
</body>
</html>
